[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttytheme"
version = "0.2.0"
description = "Live Ghostty theme picker for macOS"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]

[project.scripts]
ghosttytheme = "ghosttytheme:main"
gtheme = "ghosttytheme:main"

[project.urls]
Homepage = "https://hypercryptoman.github.io/gtheme/"
Repository = "https://github.com/hypercryptoman/gtheme"
Issues = "https://github.com/hypercryptoman/gtheme/issues"

[tool.setuptools]
py-modules = ["ghosttytheme"]
